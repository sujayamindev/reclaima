[tool.ruff.lint]
# Ruff 0.16.0 expanded its default rule set from 59 to 413 rules; pin an
# explicit selection here so future ruff upgrades can't silently change what
# CI enforces. B008 (Depends() in argument defaults) is FastAPI's documented
# dependency-injection pattern, not a bug, so it is deliberately excluded.
# B010 (setattr -> attribute assignment) is also excluded: converting these
# call sites makes mypy check assignments it previously couldn't see through
# setattr, surfacing ~34 pre-existing SQLAlchemy Column[T]-vs-T mismatches
# that are a separate typing issue, not something to fix as a lint side effect.
select = [
    "E4", "E7", "E9", # pycodestyle (ruff's pre-0.16 default core)
    "F",              # pyflakes
    "I001",           # import block sorting/formatting
    "G201",           # logger.exception() over logger.error(..., exc_info=True)
    "C401",           # unnecessary generator (rewrite as set comprehension)
]
